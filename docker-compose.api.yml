# Production compose for armoryworks-api (Minisforum, 192.168.1.198).
# Runs the .NET API + Postgres. UI lives on armoryworks-web.
#
# Image source: GHCR (ghcr.io/armoryworks/armory-works-server). Production
# never builds locally. Images are built + pushed by the .github/workflows/
# release-server.yml workflow in the armoryworks/armoryworks.com source repo.
# The aw-deploy CLI pins SERVER_IMAGE_TAG in .env on every deploy.
#
# Bring up with:
#   aw-deploy <tag>              # operator-driven deploy + healthcheck rollback
#   docker compose -f docker-compose.api.yml up -d    # straight compose (rarely)
#
# The API container publishes 8203 inside Docker; UFW on the host restricts
# 8203/tcp inbound to 192.168.1.0/24 only. Postgres is internal to the
# Docker network — never published to the host.

name: armory-works-api

services:

  armory-works-db:
    image: postgres:16-alpine
    container_name: armory-works-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-armory_works_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - armory-works-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-armory_works_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports stanza — DB is reachable only from the API container via the
    # Docker network. Never bind 5432 to the host.

  armory-works-server:
    # Pull from GHCR. aw-deploy rewrites SERVER_IMAGE_TAG on every deploy.
    # 'latest' is the default ONLY because compose requires one — aw-deploy
    # refuses to deploy 'latest' and always pins to an immutable tag
    # (main-<sha> or X.Y.Z).
    image: ghcr.io/armoryworks/armory-works-server:${SERVER_IMAGE_TAG:-latest}
    container_name: armory-works-server
    restart: unless-stopped
    depends_on:
      armory-works-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # DB lives in this same compose project, reached by container name.
      ConnectionStrings__armory_works_db: "Host=armory-works-db;Port=5432;Database=${POSTGRES_DB:-armory_works_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"

      # Outbound email.
      Email__FromAddress:         ${EMAIL_FROM_ADDRESS:-info@armoryworks.com}
      Email__FromDisplayName:     ${EMAIL_FROM_DISPLAY_NAME:-Armory Works}
      Email__SmtpHost:            ${EMAIL_SMTP_HOST:-}
      Email__SmtpPort:            ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUser:            ${EMAIL_SMTP_USER:-}
      Email__SmtpPassword:        ${EMAIL_SMTP_PASSWORD:-}
      Email__LogInsteadOfSend:    ${EMAIL_LOG_INSTEAD_OF_SEND:-false}
      ContactNotification__Email: ${CONTACT_NOTIFICATION_EMAIL:-info@armoryworks.com}

      # Cross-site read of qb-engineer's public meta endpoint.
      QbEngineer__BaseUrl: ${QB_ENGINEER_BASE_URL:-https://qb-engineer.com}

      # OIDC via Google Workspace.
      Oidc__Authority:             ${OIDC_AUTHORITY:-https://accounts.google.com}
      Oidc__ClientId:              ${OIDC_CLIENT_ID:-}
      Oidc__ClientSecret:          ${OIDC_CLIENT_SECRET:-}
      Oidc__CallbackPath:          ${OIDC_CALLBACK_PATH:-/signin-oidc}
      Oidc__SignedOutCallbackPath: ${OIDC_SIGNED_OUT_CALLBACK_PATH:-/signout-callback-oidc}
      Oidc__AllowedHostedDomain:   ${OIDC_ALLOWED_HOSTED_DOMAIN:-armoryworks.com}

      # Lead relay → Google Apps Script → Sheets.
      AppsScript__ScriptUrl:    ${APPS_SCRIPT_URL:-}
      AppsScript__SharedSecret: ${APPS_SCRIPT_SECRET:-}

      # CORS: UI calls /api/* same-origin via host nginx on web box; CORS is
      # belt-and-suspenders for cross-origin contexts (e.g. forge.armoryworks.com).
      Cors__AllowedOrigins__0: https://armoryworks.com
      Cors__AllowedOrigins__1: https://www.armoryworks.com
      Cors__AllowedOrigins__2: https://forge.armoryworks.com

    labels:
      armoryworks.deploy-mode: "prod"

    ports:
      # Binds 0.0.0.0:8203 inside the host. UFW restricts inbound to
      # 192.168.1.0/24 (LAN) only.
      - "${API_PORT:-8203}:8080"

volumes:
  armory-works-db-data:
