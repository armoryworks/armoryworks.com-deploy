# Host-nginx vhost for forge-test.armoryworks.com — forge-test SPA.
#
# Backend: forge-test on armoryworks-api (192.168.1.198:4300).
# Forge-test is a public-facing test-bed SPA; same forge-api as
# forge.armoryworks.com but a separately-built UI bundle. /api/ proxy
# on this hostname lets the SPA call same-origin /api/* (no CORS).
#
# Naming note: one-level subdomain (forge-test.*) instead of
# test.forge.* because Cloudflare free-plan Universal SSL only covers
# *.armoryworks.com (one wildcard level).
#
# Cert: shared *.armoryworks.com Origin Cert.
#
# Install:
#   sudo cp /opt/armoryworks-deploy/ops/nginx/forge-test.armoryworks.com.conf \
#     /etc/nginx/sites-available/forge-test.armoryworks.com.conf
#   sudo ln -s /etc/nginx/sites-available/forge-test.armoryworks.com.conf \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP → HTTPS redirect --------------------------------------------------
server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name forge-test.armoryworks.com;

    location / {
        return 301 https://forge-test.armoryworks.com$request_uri;
    }
}

# ---- HTTPS ------------------------------------------------------------------
server {
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    http2 on;
    server_name forge-test.armoryworks.com;

    rewrite ^(/.+)/$ $1 last;

    ssl_certificate     /etc/letsencrypt/live/armoryworks.com.cloudflare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armoryworks.com.cloudflare/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    # ---- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass         http://192.168.1.198:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- OIDC callbacks ------------------------------------------------------
    location = /signin-oidc {
        proxy_buffering    off;
        proxy_pass         http://192.168.1.198:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /signout-callback-oidc {
        proxy_buffering    off;
        proxy_pass         http://192.168.1.198:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- SPA -----------------------------------------------------------------
    location / {
        proxy_pass         http://192.168.1.198:4300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
