# Primary host-nginx vhost for armoryworks.com.
#
# Topology (split deployment, May 2026 onward):
#   - armoryworks-web (this box): cloudflared → host nginx → UI container
#     (127.0.0.1:4203). All public traffic terminates here.
#   - armoryworks-api (192.168.1.198): .NET API + Postgres. Reached over LAN
#     at 192.168.1.198:8203 by this nginx for /api/*, /signin-oidc,
#     /signout-callback-oidc. UFW on api box restricts 8203 to LAN only.
#
# Cloudflare Tunnel terminates the public connection at Cloudflare's edge and
# forwards inside the host's outbound-initiated tunnel to nginx on
# 127.0.0.1:443. nginx terminates TLS using the Cloudflare Origin Certificate
# (15-year validity, only valid for traffic coming via Cloudflare).
#
# Default ports: 4203 (local UI container) / 8203 (remote API on api box).
#
# Install:
#   sudo cp /opt/armoryworks-deploy/ops/nginx/armoryworks.com.conf \
#     /etc/nginx/sites-available/armoryworks.com.conf
#   sudo ln -s /etc/nginx/sites-available/armoryworks.com.conf \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP → HTTPS redirect + ACME challenge ---------------------------------
server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name armoryworks.com www.armoryworks.com;

    # Vestigial Let's Encrypt webroot. Origin Certs don't need this, but it
    # lets us drop back to LE if we ever migrate off Cloudflare.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://armoryworks.com$request_uri;
    }
}

# ---- www → apex redirect ----------------------------------------------------
server {
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    http2 on;
    server_name www.armoryworks.com;

    ssl_certificate     /etc/letsencrypt/live/armoryworks.com.cloudflare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armoryworks.com.cloudflare/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    return 301 https://armoryworks.com$request_uri;
}

# ---- apex -------------------------------------------------------------------
server {
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    http2 on;
    server_name armoryworks.com;

    # Strip a trailing slash from any non-root path before location matching.
    rewrite ^(/.+)/$ $1 last;

    ssl_certificate     /etc/letsencrypt/live/armoryworks.com.cloudflare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armoryworks.com.cloudflare/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none';"
        always;

    # OIDC callback returns a Set-Cookie header containing the encrypted
    # id_token — easily 4-8KB. nginx's default proxy_buffer_size (4k)
    # overflows on that response and returns 502 instead of letting it
    # through. Bump buffers for the whole vhost (cheap memory, harmless
    # for the smaller responses from the UI + /api/health).
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    # ---- Maintenance fallback ----------------------------------------------
    # When an upstream is unreachable — the UI container's recreate window
    # during an aw-deploy, a crash, or a port misconfig — nginx would emit a
    # bare 502 that Cloudflare renders as its own error page. Intercept
    # 502/503/504 and serve a branded 503 + Retry-After from a local file
    # instead. Server-level, so it covers every proxied location below.
    # proxy_intercept_errors also catches a 5xx returned by a live upstream.
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /var/www/armoryworks-maintenance;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
    }

    # ---- API ---------------------------------------------------------------
    # Cross-LAN proxy to .NET API on armoryworks-api (192.168.1.198:8203).
    # UFW on the api box restricts 8203/tcp to 192.168.1.0/24 only.
    location /api/ {
        proxy_pass         http://192.168.1.198:8203;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- OIDC callbacks ----------------------------------------------------
    # The .NET OpenIdConnect middleware listens on /signin-oidc (auth code POST
    # from Google) and /signout-callback-oidc. They must reach the API
    # container on the api box, not the SPA — the SPA's static-file fallback
    # returns 405 on POST.
    #
    # proxy_buffering off: the callback response carries a chunked Set-Cookie
    # containing the encrypted id_token, easily >64KB across cookie chunks.
    # nginx's response-header buffer can't hold it (we tried 64k — not enough)
    # and 502s. Streaming through with buffering off avoids the header-size
    # ceiling entirely. No real downside on a single-shot redirect.
    location = /signin-oidc {
        proxy_buffering    off;
        proxy_pass         http://192.168.1.198:8203;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /signout-callback-oidc {
        proxy_buffering    off;
        proxy_pass         http://192.168.1.198:8203;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- SPA ---------------------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:4203;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
