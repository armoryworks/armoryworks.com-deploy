# Host-nginx vhost for logs.armoryworks.com — Seq logging UI.
#
# Backend: forge-logs container on armoryworks-api (192.168.1.198:5340 →
# container:80). The forge-deploy compose sets SEQ_PATHBASE=/logs but Seq
# doesn't actually honor that env var name (latent forge-deploy bug —
# probably wants SEQ_API_CANONICALURI or similar). For now Seq serves at
# root, so we proxy / straight through. Seq's own login (admin user +
# bcrypt-hashed password — see SEQ_ADMIN_PASSWORD in 1Password) gates access.
#
# Cert: shared *.armoryworks.com Origin Cert.
#
# Install:
#   sudo cp /opt/armoryworks-deploy/ops/nginx/logs.armoryworks.com.conf \
#     /etc/nginx/sites-available/logs.armoryworks.com.conf
#   sudo ln -s /etc/nginx/sites-available/logs.armoryworks.com.conf \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP → HTTPS redirect --------------------------------------------------
server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name logs.armoryworks.com;

    location / {
        return 301 https://logs.armoryworks.com$request_uri;
    }
}

# ---- HTTPS ------------------------------------------------------------------
server {
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    http2 on;
    server_name logs.armoryworks.com;

    ssl_certificate     /etc/letsencrypt/live/armoryworks.com.cloudflare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armoryworks.com.cloudflare/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # Seq UI serves at root. Long-lived event-tail connections, so
    # proxy_buffering off to surface events as they arrive.
    location / {
        proxy_pass         http://192.168.1.198:5340;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;
        proxy_read_timeout 1d;
    }
}
