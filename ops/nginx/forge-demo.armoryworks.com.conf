# Host-nginx vhost for forge-demo.armoryworks.com — static Forge demo SPA.
#
# Backend: forge-demo container on armoryworks-api (192.168.1.198:4203).
# Static-only — Angular bundle + bundled JSON via demoApiInterceptor.
# No /api/ proxy needed; the demo synthesizes everything in-browser.
#
# Naming note: this is intentionally a one-level subdomain (forge-demo.*)
# rather than a deeper demo.forge.* path, because Cloudflare's free-plan
# Universal SSL only covers *.armoryworks.com (one wildcard level). Deeper
# subdomains would need Advanced Certificate Manager.
#
# Cert: shared *.armoryworks.com Origin Cert.
#
# Install:
#   sudo cp /opt/armoryworks-deploy/ops/nginx/forge-demo.armoryworks.com.conf \
#     /etc/nginx/sites-available/forge-demo.armoryworks.com.conf
#   sudo ln -s /etc/nginx/sites-available/forge-demo.armoryworks.com.conf \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP → HTTPS redirect --------------------------------------------------
server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name forge-demo.armoryworks.com;

    location / {
        return 301 https://forge-demo.armoryworks.com$request_uri;
    }
}

# ---- HTTPS ------------------------------------------------------------------
server {
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    http2 on;
    server_name forge-demo.armoryworks.com;

    ssl_certificate     /etc/letsencrypt/live/armoryworks.com.cloudflare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armoryworks.com.cloudflare/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    location / {
        proxy_pass         http://192.168.1.198:4203;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
