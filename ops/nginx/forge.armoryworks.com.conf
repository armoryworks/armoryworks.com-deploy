# Host-nginx vhost for forge.armoryworks.com — primary Forge product surface.
#
# Topology (Forge migration, May 2026):
#   - armoryworks-web (this box): cloudflared → host nginx → cross-LAN
#     to armoryworks-api (192.168.1.198) for everything. No local containers
#     for Forge — the entire Forge stack lives on the api box.
#   - armoryworks-api: forge-ui (4200), forge-api (5000) — UFW restricts both
#     to 192.168.1.0/24.
#
# Cert: shared *.armoryworks.com Origin Cert (also covers
# *.forge.armoryworks.com via the second wildcard).
#
# Install:
#   sudo cp /opt/armoryworks-deploy/ops/nginx/forge.armoryworks.com.conf \
#     /etc/nginx/sites-available/forge.armoryworks.com.conf
#   sudo ln -s /etc/nginx/sites-available/forge.armoryworks.com.conf \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP → HTTPS redirect --------------------------------------------------
server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name forge.armoryworks.com;

    location / {
        return 301 https://forge.armoryworks.com$request_uri;
    }
}

# ---- HTTPS apex -------------------------------------------------------------
server {
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    http2 on;
    server_name forge.armoryworks.com;

    # Strip trailing slash from any non-root path.
    rewrite ^(/.+)/$ $1 last;

    ssl_certificate     /etc/letsencrypt/live/armoryworks.com.cloudflare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armoryworks.com.cloudflare/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # Bumped buffers for the OIDC callback (Set-Cookie with encrypted id_token).
    # Same pattern as armoryworks.com.conf.
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    # ---- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass         http://192.168.1.198:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- SignalR hubs (chunked transfer for streamed updates) ---------------
    # If forge-api uses SignalR, the negotiate handshake hits /api/... but
    # the long-poll/websocket transport may need buffering off. Keep this
    # block to give us a place to land if we hit SignalR issues later.
    # location ~ ^/api/.*/hub$ {
    #     proxy_buffering    off;
    #     proxy_pass         http://192.168.1.198:5000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    #     proxy_set_header   Host       $host;
    # }

    # ---- OIDC callbacks ------------------------------------------------------
    # proxy_buffering off because the Set-Cookie containing the encrypted
    # id_token can exceed our response-header buffer ceiling. Same workaround
    # as armoryworks.com — see commit 74e4406 for the AW backstory.
    location = /signin-oidc {
        proxy_buffering    off;
        proxy_pass         http://192.168.1.198:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /signout-callback-oidc {
        proxy_buffering    off;
        proxy_pass         http://192.168.1.198:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- SPA -----------------------------------------------------------------
    location / {
        proxy_pass         http://192.168.1.198:4200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
