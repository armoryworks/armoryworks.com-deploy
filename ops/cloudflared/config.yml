# /etc/cloudflared/config.yml — armoryworks-prod tunnel ingress.
#
# Public traffic hits Cloudflare's edge, terminates there, then Cloudflare
# forwards through the outbound-initiated tunnel to this host. Where the
# request goes from here is determined by `service:` below.
#
# Co-hosted stacks share this tunnel. Every container binds 127.0.0.1 on this
# box; host nginx routes by HTTP Host header to the right vhost:
#   armoryworks.com    — static marketing site (UI container :4203)
#   forge.armoryworks.com / forge-demo / forge-test  — Forge product, demo,
#                        test SPA. One-level subdomain naming because the
#                        free-plan Universal SSL only covers *.armoryworks.com.
#
# All entries terminate at host nginx on 127.0.0.1:443 with TLS host
# armoryworks.com (the Origin Cert covers *.armoryworks.com). nginx then
# routes by HTTP Host header to the right vhost.

tunnel: e5a5fea7-a8d3-48db-af39-9c2ca27f06e6
credentials-file: /etc/cloudflared/e5a5fea7-a8d3-48db-af39-9c2ca27f06e6.json

ingress:
  # ---- armoryworks.com (marketing site) -------------------------------------
  - hostname: armoryworks.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: armoryworks.com

  - hostname: www.armoryworks.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: armoryworks.com

  # ---- Forge stack ----------------------------------------------------------
  - hostname: forge.armoryworks.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: armoryworks.com

  - hostname: forge-demo.armoryworks.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: armoryworks.com

  - hostname: forge-test.armoryworks.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: armoryworks.com

  # ---- Ops surfaces ---------------------------------------------------------
  - hostname: logs.armoryworks.com
    service: https://127.0.0.1:443
    originRequest:
      originServerName: armoryworks.com

  # ---- Catch-all (anything else returns 404 from cloudflared itself) --------
  - service: http_status:404
